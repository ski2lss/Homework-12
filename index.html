<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>

		<svg width="200" height="200" viewBox="0 0 200 200"
		role="img" aria-label="Оранжевый квадрат с синей обводкой">
		<rect class="square" x="50" y="50" width="100" height="100"/>
		</svg>	

		<svg width="200" height="200" viewBox="0 0 200 200"
		role="img" aria-label="Зеленый квадрат с салатовой обводкой">
		<rect class="rectangle" x="30" y="60" width="140" height="80"/>
		</svg>

		<svg width="200" height="200" viewBox="0 0 200 200"
		role="img" aria-label="Красный круг с бежевой обводкой">
		<circle class="circle" cx="100" cy="100" r="50"/>
		</svg>

		<svg width="200" height="200" viewBox="0 0 200 200"
		role="img" aria-label="Черный овал с желтой обводкой">
		<ellipse class="ellipse" cx="100" cy="100" rx="70" ry="50"/>
		</svg>

</body>
</html>
